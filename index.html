<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valoración Gratuita de tu Vivienda en Madrid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 12px;
      margin-top: 40px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #25D366;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #1ebc59;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¿Quieres vender tu piso en Madrid?</h1>
    <p>Te ofrezco una valoración gratuita y sin compromiso. Soy Mario De Medina, agente inmobiliario especializado en tu zona. Te ayudo a vender rápido y al mejor precio.</p>
    <form onsubmit="enviarWhatsApp(); return false;">
      <label for="name">Nombre completo</label>
      <input type="text" id="name" name="name" required /><label for="phone">Teléfono</label>
  <input type="tel" id="phone" name="phone" required />

  <label for="email">Correo electrónico</label>
  <input type="email" id="email" name="email" required />

  <label for="address">Dirección del inmueble</label>
  <input type="text" id="address" name="address" required />

  <label for="message">Comentarios adicionales</label>
  <textarea id="message" name="message" rows="4"></textarea>

  <button type="submit">Enviar por WhatsApp</button>
</form>

  </div>  <script>
    function enviarWhatsApp() {
      const nombre = document.getElementById('name').value;
      const telefono = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const direccion = document.getElementById('address').value;
      const comentarios = document.getElementById('message').value;

      const mensaje = `Hola Mario, soy ${nombre}.\nTeléfono: ${telefono}\nEmail: ${email}\nDirección del inmueble: ${direccion}\nComentarios: ${comentarios}`;
      const numero = "34637723517"; // Sustituye con tu número de WhatsApp, sin + ni espacios

      const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script></body>
</html>
